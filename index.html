    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background: #f5f5f5;
            font-size: 14px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 5px; }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            padding: 0 20px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 20px;
        }
        .tab-btn {
            padding: 10px 16px;
            border: none;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #667eea;
            color: white;
        }
        .tab-btn:hover {
            background: #ddd;
        }
        .panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 13px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .btn-generate {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
            font-size: 14px;
        }
        .btn-generate:hover {
            background: #5568d3;
        }
        .output-item {
            margin-bottom: 15px;
            padding: 12px;
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            border-radius: 4px;
        }
        .output-label {
            font-size: 12px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .output-wrapper {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }
        .output-content {
            flex: 1;
            font-size: 13px;
            font-family: 'Segoe UI', monospace;
            background: white;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 3px;
            word-break: break-all;
        }
        .btn-copy {
            font-size: 11px;
            padding: 8px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-copy:hover { background: #5568d3; }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>

        function getCityId(cityName) {
            if (citiesData[cityName]) return citiesData[cityName];
            for (let key in citiesData) {
                if (key.toLowerCase() === cityName.toLowerCase()) return citiesData[key];
            }
            return cityName;
        }

        function getPoiCityId(cityName) {
            if (poiCitiesData[cityName]) return poiCitiesData[cityName];
            for (let key in poiCitiesData) {
                if (key.toLowerCase() === cityName.toLowerCase()) return poiCitiesData[key];
            }
            return cityName;
        }

        function formatDate(date) {
            const yr = date.getFullYear();
            const mo = String(date.getMonth() + 1).padStart(2, '0');
            const da = String(date.getDate()).padStart(2, '0');
            return `${yr}-${mo}-${da}`;
        }

        const sceneConfigs = {
            campaign: {
                name: '1. Campaign',
                inputs: [
                    {id: 'campaign_region', label: 'Region', type: 'select', defaultValue: 'sg'},
                    {id: 'campaign_path', label: 'Path', type: 'text', defaultValue: 'memberday'},
                    {id: 'campaign_params', label: 'Include params', type: 'checkbox', defaultValue: false}
                ],
                outputs: [
                    {id: 'campaign_u1', label: 'Universal'},
                    {id: 'campaign_simple', label: 'Simplest'},
                    {id: 'campaign_deeplink', label: 'Deeplink'}
                ],
                generate(inputs) {
                    const region = inputs.campaign_region;
                    const path = inputs.campaign_path.trim();
                    const info = regionMap[region];
                    const url = `https://${info.prefix}.trip.com/sale/w/${path}.html`;

                    let simple = url;
                    if (inputs.campaign_params) simple += `?&transparentBar=1&wkp=1`;

                    let dl = `ctripglobal://WebView?url=${encodeURIComponent(url)}`;
                    if (inputs.campaign_params) {
                        dl = `ctripglobal://WebView?url=${encodeURIComponent(`${url}?locale=${info.locale}&curr=${info.curr}&transparentBar=1&wkp=1`)}`;
                    }

                    return {
                        campaign_u1: `${url}?locale=${info.locale}&curr=${info.curr}&transparentBar=1`,
                        campaign_simple: simple,
                        campaign_deeplink: dl
                    };
                }
            },
            flight: {
                name: '2. Flight',
                inputs: [
                    {id: 'flight_region', label: 'Region', type: 'select', defaultValue: 'sg'},
                    {id: 'flight_dct', label: 'Departure', type: 'text', defaultValue: 'SIN'},
                    {id: 'flight_act', label: 'Arrival', type: 'text', defaultValue: 'HKG'},
                    {id: 'flight_airline', label: 'Airline (Optional)', type: 'text', defaultValue: ''},
                    {id: 'flight_type', label: 'Type', type: 'select', defaultValue: 'RT', options: ['RT', 'OW']},
                    {id: 'flight_class', label: 'Class', type: 'select', defaultValue: 'Y', options: ['Y', 'S', 'C', 'F']},
                    {id: 'flight_pax', label: 'Passengers', type: 'number', defaultValue: '1'},
                    {id: 'flight_nonstop', label: 'Nonstop', type: 'select', defaultValue: 'off', options: ['on', 'off']}
                ],
                outputs: [
                    {id: 'flight_u', label: 'Universal'},
                    {id: 'flight_d', label: 'Deeplink'}
                ],
                generate(inputs) {
                    const region = inputs.flight_region;
                    const info = regionMap[region];
                    const dct = inputs.flight_dct.toUpperCase();
                    const act = inputs.flight_act.toUpperCase();
                    const airline = inputs.flight_airline.toUpperCase();
                    const ddate = formatDate(new Date());
                    const rdate = formatDate(new Date(Date.now() + 3*24*60*60*1000));

                    let u = `https://${info.prefix}.trip.com/flights/showfarefirst?dcity=${dct}&acity=${act}&FlightWay=${inputs.flight_type}&class=${inputs.flight_class}&quantity=${inputs.flight_pax}&ddate=${ddate}&rdate=${rdate}&locale=${info.locale}&curr=${info.curr}`;
                    if (airline) u += `&airline=${airline}`;
                    if (inputs.flight_nonstop === 'on') u += `&nonstop=on`;

                    let d = `ctripglobal://FlightListAB/?dct=${dct}&act=${act}&ddt=${ddate}&tp=i`;
                    if (airline) d += `&al=${airline}`;

                    return {
                        flight_u: u,
                        flight_d: d
                    };
                }
            },
            hotel: {
                name: '3. Hotel',
                inputs: [
                    {id: 'hotel_region', label: 'Region', type: 'select', defaultValue: 'sg'},
                    {id: 'hotel_city', label: 'City', type: 'text', defaultValue: 'Singapore'},
                    {id: 'hotel_leadtime', label: 'Leadtime (days)', type: 'number', defaultValue: '3'},
                    {id: 'hotel_nights', label: 'Nights', type: 'number', defaultValue: '3'},
                    {id: 'hotel_id', label: 'Hotel ID', type: 'text', defaultValue: '904373'}
                ],
                outputs: [
                    {id: 'hotel_list_u', label: 'List - Universal'},
                    {id: 'hotel_list_d', label: 'List - Deeplink'},
                    {id: 'hotel_detail_u', label: 'Detail - Universal'},
                    {id: 'hotel_detail_d', label: 'Detail - Deeplink'}
                ],
                generate(inputs) {
                    const region = inputs.hotel_region;
                    const info = regionMap[region];
                    const city = inputs.hotel_city.trim();
                    const cityId = getCityId(city);
                    const leadtime = parseInt(inputs.hotel_leadtime) || 0;
                    const nights = parseInt(inputs.hotel_nights) || 0;
                    const hotelId = inputs.hotel_id.trim();

                    const today = new Date();
                    const checkin = new Date(today);
                    checkin.setDate(checkin.getDate() + leadtime);
                    const checkout = new Date(checkin);
                    checkout.setDate(checkout.getDate() + nights);

                    const checkinStr = formatDate(checkin);
                    const checkoutStr = formatDate(checkout);

                    return {
                        hotel_list_u: `https://${info.prefix}.trip.com/hotels/list?city=${cityId}&checkIn=${checkinStr}&checkOut=${checkoutStr}&locale=${info.locale}&curr=${info.curr}`,
                        hotel_list_d: `ctripglobal://hotel/hotellist?city=${cityId}`,
                        hotel_detail_u: `https://${info.prefix}.trip.com/hotels/detail/?cityid=${cityId}&hotelid=${hotelId}&checkin=${checkinStr}&checkout=${checkoutStr}&locale=${info.locale}&curr=${info.curr}`,
                        hotel_detail_d: `ctripglobal://hotel/hoteldetail?ct=${cityId}&hid=${hotelId}&cin=${checkinStr}&cout=${checkoutStr}`
                    };
                }
            },
            poi: {
                name: '4. POI',
                inputs: [
                    {id: 'poi_region', label: 'Region', type: 'select', defaultValue: 'sg'},
                    {id: 'poi_city', label: 'City', type: 'text', defaultValue: 'Hong Kong'},
                    {id: 'poi_id', label: 'POI ID', type: 'text', defaultValue: '76136'}

                    {id: 'poi_home_d', label: 'Homepage - Deeplink'},

                    {id: 'poi_list_d', label: 'List - Deeplink'},

                    const city = inputs.poi_city.trim();
                    const cityId = getPoiCityId(city);
                    const poiId = inputs.poi_id.trim();
                    const cityUrl = city.replace(/\s+/g, '-');

                    return {
                        poi_home_u: `https://${info.prefix}.trip.com/travel-guide/destination/${cityUrl}-${cityId}/?locale=${info.locale}&curr=${info.curr}`,
                        poi_home_d: `ctripglobal://crn/rn_ibu_traveling/_crn_config?CRNModuleName=RN_Product_IBU_Traveling&CRNType=1&initialPage=DestDetail&districtId=${cityId}`,
                        poi_list_u: `https://${info.prefix}.trip.com/travel-guide/attraction/${cityUrl}-${cityId}/tourist-attractions/?locale=${info.locale}&curr=${info.curr}`,
                        poi_list_d: `ctripglobal://crn/rn_ibu_localtone/_crn_config?CRNModuleName=ibulocaltone&CRNType=1&initialPage=list&pagetype=city&id=${cityId}&citytype=dt&districttype=3&pshowcode=Ticket2`,

                        poi_detail_d: `ctripglobal://crn/rn_ibu_traveling/_crn_config?CRNModuleName=RN_Product_IBU_Traveling&CRNType=1&transparentstatusbar=1&initialPage=POIDetail&sightId=${poiId}`
                    };
                }
            },
            tour: {
                name: '5. Tour',
                inputs: [
                    {id: 'tour_region', label: 'Region', type: 'select', defaultValue: 'sg'},
                    {id: 'tour_city', label: 'City', type: 'text', defaultValue: 'Beijing'},
                    {id: 'tour_product_id', label: 'Product ID', type: 'text', defaultValue: '69843769'}
                ],
                outputs: [
                    {id: 'tour_u', label: 'Universal'},
                    {id: 'tour_d', label: 'Deeplink'}
                ],
                generate(inputs) {
                    const region = inputs.tour_region;
                    const info = regionMap[region];
                    const city = inputs.tour_city.trim();
                    const cityId = getCityId(city);
                    const productId = inputs.tour_product_id.trim();

                    return {
                        tour_u: `https://${info.prefix}.trip.com/package-tours/detail/${productId}?city=${cityId}&locale=${info.locale}&curr=${info.curr}`,
                        tour_d: `ctripglobal://crn/rn_ibu_tour/main.js?CRNModuleName=ibu_tour&CRNType=1&initialPage=detail&departcityid=${cityId}&productid=${productId}`
                    };
                }
            },
            cruise: {
                name: '6. Cruise',
                inputs: [
                    {id: 'cruise_region', label: 'Region', type: 'select', defaultValue: 'sg'},
                    {id: 'cruise_product_id', label: 'Product ID', type: 'text', defaultValue: '99079'}
                ],
                outputs: [
                    {id: 'cruise_u', label: 'Universal'},
                    {id: 'cruise_d', label: 'Deeplink'},
                    {id: 'cruise_h5', label: 'H5 Link'}
                ],
                generate(inputs) {
                    const region = inputs.cruise_region;
                    const info = regionMap[region];
                    const productId = inputs.cruise_product_id.trim();

                    return {
                        cruise_u: `https://${info.prefix}.trip.com/cruises/line-${productId}/?locale=${info.locale}&curr=${info.curr}`,
                        cruise_d: `ctripglobal://crn/rn_ibu_cruise/index.ios.bundle?CRNModuleName=rn_ibu_cruise&CRNType=1&initialPage=ProductDetail&voyaId=${productId}`,
                        cruise_h5: `https://${info.prefix}.trip.com/cw/cruise/productDetail.html?voyaId=${productId}&locale=${info.locale}&curr=${info.curr}`
                    };
                }
            },
            carental: {
                name: '7. Car Rental',
                inputs: [
                    {id: 'car_region', label: 'Region', type: 'select', defaultValue: 'sg'},
                    {id: 'car_city', label: 'City', type: 'text', defaultValue: 'Kuala Lumpur'}
                ],
                outputs: [
                    {id: 'car_u', label: 'Universal'},
                    {id: 'car_d', label: 'Deeplink'}
                ],
                generate(inputs) {
                    const region = inputs.car_region;
                    const info = regionMap[region];
                    const city = inputs.car_city.trim();
                    const cityId = getCityId(city);

                    return {
                        car_u: `https://${info.prefix}.trip.com/carhire/online/list?serverRoute=1&pcity=${cityId}&rcity=${cityId}&locale=${info.locale}&curr=${info.curr}`,
                        car_d: `ctripglobal://crn/rn_ibu_car_app/_crn_config?CRNModuleName=rn_ibu_car_app&CRNType=1&initialPage=Market&st=ser&fromurl=common&landingto=List&apptype=OSD_T_APP&pcid=${cityId}&rcid=${cityId}`
                    };
                }
            }
        };

        let currentScene = 'campaign';

        function renderTabs() {
            const container = document.getElementById('tabs');
            container.innerHTML = '';
            Object.entries(sceneConfigs).forEach(([key, config]) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${key === currentScene ? 'active' : ''}`;
                btn.textContent = config.name;
                btn.onclick = () => {
                    currentScene = key;
                    render();
                };
                container.appendChild(btn);
            });
        }

        function renderForm() {
            const config = sceneConfigs[currentScene];
            const container = document.getElementById('formPanel');
            container.innerHTML = '';

            config.inputs.forEach(input => {
                const group = document.createElement('div');
                group.className = 'form-group';

                if (input.type === 'checkbox') {
                    group.innerHTML = `
                        <div class="checkbox-group">
                            <input type="checkbox" id="${input.id}" ${input.defaultValue ? 'checked' : ''}>
                            <label for="${input.id}" style="margin: 0;">${input.label}</label>
                        </div>
                    `;
                } else if (input.type === 'select') {
                    const options = input.options ? input.options : Object.keys(regionMap);
                    let optionsHtml = options.map(opt => `<option value="${opt}" ${opt === input.defaultValue ? 'selected' : ''}>${opt}</option>`).join('');
                    group.innerHTML = `
                        <label>${input.label}</label>
                        <select id="${input.id}">${optionsHtml}</select>
                    `;
                } else {
                    group.innerHTML = `
                        <label>${input.label}</label>
                        <input type="${input.type}" id="${input.id}" value="${input.defaultValue}">
                    `;
                }
                container.appendChild(group);
            });

            const btn = document.createElement('button');
            btn.className = 'btn-generate';
            btn.textContent = 'Generate';
            btn.onclick = renderOutputs;
            container.appendChild(btn);
        }

        function renderOutputs() {
            const config = sceneConfigs[currentScene];
            const inputs = {};

            config.inputs.forEach(input => {
                const elem = document.getElementById(input.id);
                inputs[input.id] = input.type === 'checkbox' ? elem.checked : elem.value;
            });

            const results = config.generate(inputs);
            const container = document.getElementById('outputPanel');
            container.innerHTML = '';

            config.outputs.forEach(output => {
                const item = document.createElement('div');
                item.className = 'output-item';

                const label = document.createElement('div');
                label.className = 'output-label';
                label.textContent = output.label;

                const wrapper = document.createElement('div');
                wrapper.className = 'output-wrapper';

                const content = document.createElement('div');
                content.className = 'output-content';
                content.textContent = results[output.id];

                const btn = document.createElement('button');
                btn.className = 'btn-copy';
                btn.textContent = 'Copy';
                btn.onclick = () => {
                    navigator.clipboard.writeText(results[output.id]);
                    btn.textContent = '✓';
                    setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
                };

                wrapper.appendChild(content);
                wrapper.appendChild(btn);
                item.appendChild(label);
                item.appendChild(wrapper);
                container.appendChild(item);
            });
        }

        function render() {
            renderTabs();
            renderForm();
            renderOutputs();
        }

        render();
    </script>
